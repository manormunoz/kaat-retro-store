name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          echo "SCREENSCRAPER_DEVUSER=${{ secrets.SCREENSCRAPER_DEVUSER }}" > .env
          echo "SCREENSCRAPER_DEVPASSWORD=${{ secrets.SCREENSCRAPER_DEVPASSWORD }}" >> .env
          echo "SCREENSCRAPER_SOFTNAME=${{ secrets.SCREENSCRAPER_SOFTNAME }}" >> .env

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/keystore.jks

      - name: Set environment variables for signing
        run: |
          echo "KEYSTORE_FILE=$HOME/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Rename APK files
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk kaat-${{ steps.version.outputs.version }}-arm64-v8a.apk || true
          mv app-armeabi-v7a-release.apk kaat-${{ steps.version.outputs.version }}-armeabi-v7a.apk || true
          mv app-x86_64-release.apk kaat-${{ steps.version.outputs.version }}-x86_64.apk || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          echo "SCREENSCRAPER_DEVUSER=${{ secrets.SCREENSCRAPER_DEVUSER }}" > .env
          echo "SCREENSCRAPER_DEVPASSWORD=${{ secrets.SCREENSCRAPER_DEVPASSWORD }}" >> .env
          echo "SCREENSCRAPER_SOFTNAME=${{ secrets.SCREENSCRAPER_SOFTNAME }}" >> .env

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Get version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Build Linux
        run: flutter build linux --release

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Download appimagetool
        run: |
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: Create AppImage structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

          # Copy icon from Android resources
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png AppDir/kaat.png

          # Create desktop file
          cat > AppDir/kaat.desktop << EOF
          [Desktop Entry]
          Name=K'aat Retro Store
          Exec=kaat
          Icon=kaat
          Type=Application
          Categories=Game;
          Comment=Browse and download retro game ROMs
          EOF

          # Create AppRun script
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/kaat" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --no-appstream AppDir kaat-${{ steps.version.outputs.version }}-x86_64.AppImage

      - name: Create tarball (portable)
        run: |
          cd build/linux/x64/release/bundle
          tar -czf ../kaat-${{ steps.version.outputs.version }}-linux-x64.tar.gz *
          cd ../
          mv kaat-${{ steps.version.outputs.version }}-linux-x64.tar.gz ../../../../

      - name: Install DEB/RPM packaging tools
        run: |
          sudo apt-get install -y rpm

      - name: Create DEB package structure
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p debian-package/usr/bin
          mkdir -p debian-package/usr/share/applications
          mkdir -p debian-package/usr/share/icons/hicolor/256x256/apps
          mkdir -p debian-package/DEBIAN

          # Copy files
          cp -r build/linux/x64/release/bundle/* debian-package/usr/bin/
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png debian-package/usr/share/icons/hicolor/256x256/apps/kaat.png

          # Create desktop file
          cat > debian-package/usr/share/applications/kaat.desktop << EOF
          [Desktop Entry]
          Name=K'aat Retro Store
          Exec=/usr/bin/kaat
          Icon=kaat
          Type=Application
          Categories=Game;
          Comment=Browse and download retro game ROMs
          EOF

          # Create control file
          cat > debian-package/DEBIAN/control << EOF
          Package: kaat
          Version: $VERSION
          Section: games
          Priority: optional
          Architecture: amd64
          Maintainer: K'aat Retro Store <noreply@github.com>
          Description: K'aat Retro Store
           Browse and download retro game ROMs with boxarts and metadata
          EOF

      - name: Build DEB package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          dpkg-deb --build debian-package kaat-$VERSION-amd64.deb

      - name: Create RPM package structure
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Split version for RPM (remove pre-release tag)
          RPM_VERSION=$(echo $VERSION | cut -d'-' -f1)
          RPM_RELEASE=$(echo $VERSION | cut -d'-' -f2-)
          if [ "$RPM_RELEASE" = "$RPM_VERSION" ]; then
            RPM_RELEASE="1"
          fi

          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Create spec file
          cat > ~/rpmbuild/SPECS/kaat.spec << EOF
          Name:           kaat
          Version:        $RPM_VERSION
          Release:        $RPM_RELEASE%{?dist}
          Summary:        K'aat Retro Store
          License:        Proprietary
          URL:            https://github.com/manormunoz/kaat-retro-store

          %description
          Browse and download retro game ROMs with boxarts and metadata

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps

          cp -r $PWD/build/linux/x64/release/bundle/* %{buildroot}/usr/bin/
          cp $PWD/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/kaat.png

          cat > %{buildroot}/usr/share/applications/kaat.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=K'aat Retro Store
          Exec=/usr/bin/kaat
          Icon=kaat
          Type=Application
          Categories=Game;
          Comment=Browse and download retro game ROMs
          DESKTOP

          %files
          /usr/bin/*
          /usr/share/applications/kaat.desktop
          /usr/share/icons/hicolor/256x256/apps/kaat.png

          %changelog
          * $(date +'%a %b %d %Y') Builder <noreply@github.com> - $RPM_VERSION-$RPM_RELEASE
          - Release $VERSION
          EOF

      - name: Build RPM package
        run: |
          cd ~/rpmbuild
          rpmbuild -bb SPECS/kaat.spec
          cp RPMS/x86_64/*.rpm $GITHUB_WORKSPACE/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            kaat-*-x86_64.AppImage
            kaat-*-linux-x64.tar.gz
            kaat-*-amd64.deb
            kaat-*.rpm

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file
        run: |
          echo "SCREENSCRAPER_DEVUSER=${{ secrets.SCREENSCRAPER_DEVUSER }}" > .env
          echo "SCREENSCRAPER_DEVPASSWORD=${{ secrets.SCREENSCRAPER_DEVPASSWORD }}" >> .env
          echo "SCREENSCRAPER_SOFTNAME=${{ secrets.SCREENSCRAPER_SOFTNAME }}" >> .env
        shell: bash

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Get version from pubspec.yaml
        id: version
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)$').Matches.Groups[1].Value -replace '\+.*', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Inno Setup script
        run: |
          $version = "${{ steps.version.outputs.version }}"
          @"
          [Setup]
          AppName=K'aat Retro Store
          AppVersion=$version
          DefaultDirName={autopf}\Kaat
          DefaultGroupName=K'aat Retro Store
          OutputDir=.
          OutputBaseFilename=kaat-$version-windows-x64-setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=admin

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs

          [Icons]
          Name: "{group}\K'aat Retro Store"; Filename: "{app}\kaat.exe"
          Name: "{autodesktop}\K'aat Retro Store"; Filename: "{app}\kaat.exe"

          [Run]
          Filename: "{app}\kaat.exe"; Description: "Launch K'aat Retro Store"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath installer.iss -Encoding ASCII

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create portable ZIP
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "kaat-$version-windows-x64-portable.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            kaat-*-windows-x64-setup.exe
            kaat-*-windows-x64-portable.zip

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android-apks/*.apk
            linux-x64/*.tar.gz
            linux-x64/*.AppImage
            linux-x64/*.deb
            linux-x64/*.rpm
            windows-x64/*.exe
            windows-x64/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
